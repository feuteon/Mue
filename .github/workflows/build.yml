name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Trouver le projet
        run: |
          $spec = Get-ChildItem -Path . -Recurse -Filter mue.spec -File | Select-Object -First 1
          if (-not $spec) {
            Get-ChildItem -Recurse -Depth 2 | Select-Object -ExpandProperty FullName
            throw "mue.spec introuvable : les fichiers du projet ne sont pas dans le depot."
          }
          "PROJ=$($spec.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Projet trouve dans : $($spec.DirectoryName)"
          Get-ChildItem $spec.DirectoryName | Select-Object -ExpandProperty Name

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        working-directory: ${{ env.PROJ }}
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Runtime Visual C++ a jour pour PyQt5
        working-directory: ${{ env.PROJ }}
        run: |
          $qt = python -c "import os, PyQt5; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'bin'))"
          foreach ($n in "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "vcruntime140.dll", "vcruntime140_1.dll", "concrt140.dll") {
            $src = Join-Path $env:WINDIR "System32\$n"
            $dst = Join-Path $qt $n
            if ((Test-Path $src) -and (Test-Path $dst)) {
              Copy-Item $src $dst -Force
              Write-Host "$n -> $((Get-Item $dst).VersionInfo.FileVersion)"
            }
          }
          python -c "import PyQt5.QtWidgets, pymupdf, rawpy, pillow_heif; d = pymupdf.open(); d.new_page(); print('Imports OK, PyMuPDF', pymupdf.VersionBind)"

      - name: FFmpeg
        working-directory: ${{ env.PROJ }}
        run: python tools/prepare_ffmpeg.py

      - name: PyInstaller
        working-directory: ${{ env.PROJ }}
        run: pyinstaller --noconfirm --clean mue.spec

      - name: Test de fumee
        working-directory: ${{ env.PROJ }}
        run: |
          $p = Start-Process dist\Mue\Mue.exe -ArgumentList "--install" -PassThru
          $null = $p.Handle
          $p.WaitForExit()
          $log = "$env:APPDATA\Mue\crash.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Mue --install a echoue (code $($p.ExitCode))" }
          $base = "HKCU:\Software\Classes\SystemFileAssociations"
          foreach ($ext in ".jpg", ".heic", ".cr2", ".mp4", ".flac", ".pdf", ".svg", ".csv") {
            if (Test-Path "$base\$ext\shell\Mue.ConvertTo") { Write-Host "OK  $ext" }
            else { throw "Menu absent pour $ext" }
          }
          Start-Process dist\Mue\Mue.exe -ArgumentList "--uninstall" -Wait

      - name: Installeur (Inno Setup)
        working-directory: ${{ env.PROJ }}
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $t = Get-Content installer.iss -Raw -Encoding utf8
          [IO.File]::WriteAllText("$PWD\installer.iss", $t, [Text.UTF8Encoding]::new($true))
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a echoue" }

      - name: Rassembler les fichiers
        working-directory: ${{ env.PROJ }}
        run: |
          $out = "$env:GITHUB_WORKSPACE\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist\Mue-Setup-*.exe $out
          Compress-Archive -Path dist\Mue\* -DestinationPath "$out\Mue-portable.zip"
          Get-ChildItem $out | ForEach-Object { "{0}  {1:N0} Mo" -f $_.Name, ($_.Length / 1MB) }

      - name: Envoi de l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: Mue-Setup
          path: out/Mue-Setup-*.exe

      - name: Envoi de la version portable
        uses: actions/upload-artifact@v4
        with:
          name: Mue-portable
          path: out/Mue-portable.zip
